#   Acesse: http://localhost:8080
# =============================================================================

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wsl-manager-backend
    restart: unless-stopped
    environment:
      DB_PATH:        /data/wsl-manager.db
      JWT_SECRET:     dev-secret-change-in-production
      ADMIN_PASSWORD: admin123
      TZ:             America/Sao_Paulo
    volumes:
      - wsl-manager-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - wsl-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wsl-manager-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wsl-net

volumes:
  wsl-manager-data:

networks:
  wsl-net:
    driver: bridge
